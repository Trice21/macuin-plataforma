services:
  # Servicio para la aplicación Laravel (Externo)
  laravel-app:
    build:
      context: ./laravel-externo
      dockerfile: Dockerfile
    container_name: macuin-laravel
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=macuin_db
      - DB_USERNAME=macuin_user
      - DB_PASSWORD=macuin_password
    volumes:
      - ./laravel-externo:/var/www/html:cached
      - laravel-vendor:/var/www/html/vendor
      - laravel-node-modules:/var/www/html/node_modules
    depends_on:
      - db

  # API Central (FastAPI)
  fastapi-api:
    build:
      context: ./fastapi-api
      dockerfile: Dockerfile
    container_name: macuin-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DB_USERNAME=macuin_user
      - DB_PASSWORD=macuin_password
      - DB_DATABASE=macuin_db
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=clave_secreta_super_segura_para_jwt
    volumes:
      - ./fastapi-api:/app
    depends_on:
      - db

  # Servicio para la aplicación Flask (Interno)
  flask-app:
    build:
      context: ./flask-interno
      dockerfile: Dockerfile
    container_name: macuin-flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - API_URL=http://macuin-api:8000
      - SECRET_KEY=flask_secret_key_super_segura
    volumes:
      - ./flask-interno:/app
    depends_on:
      - fastapi-api

  # Base de datos PostgreSQL compartida
  db:
    image: postgres:15
    container_name: macuin-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: macuin_db
      POSTGRES_USER: macuin_user
      POSTGRES_PASSWORD: macuin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  laravel-vendor:
  laravel-node-modules:
