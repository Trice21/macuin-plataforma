<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo de Autopartes - Macuin</title>
        <script scr="https://cdn.tailwindcss.com"></script>
    </head>
    <body class= "bg-gray-100">
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">Macuin Plataforma</h1>
            <nav class="space-x-4">
                <input type="text" placeholder="Buscar pieza..." class="py-1 rounded text-black outline-none">
                <button class="text-2xl">=</button>
            </nav>
        </header>
        <main class="p-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-blue-600 inline-block">Catálogo de Autopartes</h2>

            <div id="grid-catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            </div>
        </main>
        <script>
            // Determinar URLs base dinámicamente
            const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'http://macuin-api:8000';
            const FLASK_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'http://macuin-flask:5000';
            const grid = document.getElementById('grid-catalogo');
            
            // Función para construir URL de imagen robusta
            function getImageUrl(imageUrl) {
                if (!imageUrl) {
                    return `${FLASK_BASE}/static/images/default-autopart.svg`;
                }
                
                if (imageUrl.startsWith('http')) {
                    return imageUrl;
                }
                
                // Probar diferentes URLs base para la imagen
                const possibleUrls = [
                    `${API_BASE}${imageUrl}`,
                    `${FLASK_BASE}${imageUrl}`,
                    `${window.location.origin}${imageUrl}`
                ];
                
                return possibleUrls[0]; // Devolver la primera opción
            }
            
            // Cargar autopartes desde la API local (Flask)
            async function cargarAutopartes() {
                try {
                    grid.innerHTML = '<div class="col-span-full text-center py-8">Cargando autopartes...</div>';
                    
                    const response = await fetch(`${window.location.origin}/api/catalogo/autoparts`);
                    if (!response.ok) {
                        throw new Error('Error al cargar las autopartes');
                    }
                    const data = await response.json();
                    const autopartes = data.autoparts || [];
                    
                    // Limpiar el grid
                    grid.innerHTML = '';
                    
                    // Renderizar cada autoparte
                    autopartes.forEach(p => {
                        const imagen = p.image_url || '/static/images/default-autopart.svg';
                        
                        grid.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow hover:shadow-lg border-transparent hover:border-blue-500 transition-all text-center">
                            <div class="mb-4 h-32 flex items-center justify-center bg-gray-100 rounded-lg">
                                <img src="${imagen}" alt="${p.name}" class="max-h-full max-w-full object-contain rounded-lg" 
                                     style="display: block;"
                                     onerror="this.src='/static/images/default-autopart.svg'; console.log('Error con ${p.name}, usando fallback');">
                            </div>
                            <h3 class="text-gray-800 text-sm h-10 overflow-hidden font-semibold">${p.name}</h3>
                            <p class="text-blue-600 font-bold text-xl my-2">$${parseFloat(p.price).toFixed(2)}</p>
                            <p class="text-gray-500 text-xs mb-2">Stock: ${p.stock || 0}</p>
                            <a href="detalle.html?id=${p.id}" class="inline-block w-full bg-blue-600 text-white py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition">Ver Detalles</a>
                        </div>
                        `;
                    });
                    
                    if (autopartes.length === 0) {
                        grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No hay autopartes disponibles en este momento.</div>';
                    }
                    
                } catch (error) {
                    console.error('Error:', error);
                    grid.innerHTML = '<div class="col-span-full text-center text-red-500 py-8">Error al cargar las autopartes. Por favor, intenta más tarde.</div>';
                }
            }
            
            // Cargar las autopartes cuando la página se cargue
            document.addEventListener('DOMContentLoaded', cargarAutopartes);
        </script>
    </body>
    </html>
