{% extends "layout.html" %}

{% block title %}Editar Usuario{% endblock %}
{% block header_title %}Editar Usuario #{{ user.id }}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form action="{{ url_for('usuarios_editar', id=user.id) }}" method="POST" style="max-width: 600px;">
            <div class="mb-4">
                <label for="name" class="form-label fw-bold">Nombre Completo</label>
                <input type="text" name="name" id="name" class="form-control" value="{{ user.name }}" required minlength="3" maxlength="100">
                <div class="form-text text-muted">Mínimo 3 caracteres.</div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" required>
                <div class="form-text text-muted">Debe ser un correo válido.</div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label fw-bold">Rol</label>
                <select name="role" id="role" class="form-control" required>
                    <option value="client" {% if user.role == 'client' %}selected{% endif %}>Cliente</option>
                    <option value="employee" {% if user.role == 'employee' %}selected{% endif %}>Empleado</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrador</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-2"></i>Guardar Cambios
                </button>
                <a href="{{ url_for('admin_usuarios') }}" class="btn btn-outline-secondary px-4">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
